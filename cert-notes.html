<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Notes · SkillRadius</title>
<meta name="description" content="Study notes and module progress for your SkillRadius certification.">
<meta name="sr-page" content="certifications">
<meta name="robots" content="noindex">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  /* Figma frame "notes" (Certification section): module sidebar + lesson content + bottom nav */
  body { min-height: 100dvh; }
  .nt { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100dvh - var(--header-h)); border-top: 1px solid var(--primary); }
  .nt-side { background: #f8f9ff; border-right: 1px solid var(--tint); padding-top: 16px; position: sticky; top: var(--header-h); height: calc(100dvh - var(--header-h)); overflow-y: auto; }
  .nt-side h2 { font-size: 11px; font-weight: 600; color: var(--ink-3); padding: 0 20px 7px; }
  .nt-side a { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 56px; padding: 0 12px; margin-bottom: 8px; text-decoration: none; color: #222; font-size: 14px; font-weight: 600; position: relative; }
  .nt-side a:hover { background: #eef1ff; }
  .nt-side a[aria-current="page"] { background: var(--tint); color: var(--brand); }
  .nt-side a[aria-current="page"]::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--primary); }
  .nt-side .n { width: 24px; height: 24px; border-radius: 50%; background: var(--tint); color: var(--ink-3); font-size: 10px; font-weight: 600; display: grid; place-items: center; }
  .nt-side a[aria-current="page"] .n { background: var(--primary); color: #fff; }
  .nt-side a.done .n { background: #cdf3dc; color: #227444; }
  .nt-side a.done .n svg { width: 14px; height: 14px; }
  .nt-side .lk { width: 14px; height: 14px; color: var(--ink-3); }
  .nt-main { display: flex; flex-direction: column; min-width: 0; }
  .nt-body { flex: 1; padding: 24px 48px 40px; max-width: 1428px; }
  .nt-crumb { font-size: 11px; color: var(--ink-3); }
  .nt-crumb a { color: inherit; text-decoration: none; } .nt-crumb a:hover { color: var(--primary); }
  .nt-body h1 { font-size: clamp(22px, 1.62vw, 28px); font-weight: 600; color: #000; margin-top: 19px; line-height: 34px; }
  .nt-body .ls { font-size: 16px; font-weight: 500; color: var(--primary); margin-top: 4px; padding-bottom: 6px; border-bottom: 1px solid var(--tint); }
  .nt-body h2 { font-size: 18px; font-weight: 600; color: #000; margin-top: 16px; }
  .nt-body .p { font-size: 14px; color: var(--ink-2); line-height: 17px; margin-top: 14px; }
  .nt-code { background: #05192d; border-radius: 10px; padding: 14px 20px; margin-top: 38px; font: 12px/16px var(--mono); color: #fff; white-space: pre; overflow-x: auto; }
  .nt-code .c { color: #96a7ff; }
  .nt-body h3 { font-size: 16px; font-weight: 600; color: #000; margin-top: 16px; }
  .kc { display: grid; gap: 8px; margin-top: 12px; }
  .kc div { position: relative; background: #f8f9ff; border: 1px solid var(--tint); border-radius: 10px; padding: 12px 16px; min-height: 60px; overflow: hidden; }
  .kc div::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--primary); }
  .kc b { display: block; font-size: 13px; font-weight: 600; color: var(--brand); }
  .kc span { display: block; font-size: 12px; color: var(--ink-2); margin-top: 4px; }
  .try { background: #eef1ff; border: 1px solid var(--primary); border-radius: 10px; padding: 20px; margin-top: 20px; font-size: 13px; color: var(--brand); }
  .nt-nav { position: sticky; bottom: 0; background: #f8f9ff; border-top: 1px solid var(--tint); display: grid; grid-template-columns: 200px minmax(0, 1fr) 200px; align-items: center; gap: 12px; padding: 16px 48px; }
  .nt-nav .btn { height: 40px; border-radius: 34px; font-size: 13px; }
  .nt-nav .prev { background: #fff; border: 1px solid var(--border); color: var(--ink-3); font-weight: 500; box-shadow: none; }
  .nt-nav .prev:not([aria-disabled="true"]):hover { color: var(--primary); border-color: var(--primary); }
  .nt-nav .prev[aria-disabled="true"] { opacity: .55; pointer-events: none; }
  .nt-nav .mid { text-align: center; font-size: 12px; color: var(--ink-3); }
  .nt-nav .mid .bar { max-width: 260px; margin: 6px auto 0; }
  .nt-side-toggle { display: none; }
  @media (max-width: 900px) {
    .nt { grid-template-columns: minmax(0, 1fr); }
    .nt-side { position: static; height: auto; max-height: none; border-right: 0; border-bottom: 1px solid var(--tint); }
    .nt-side[data-open="false"] a { display: none; }
    .nt-side-toggle { display: flex; width: calc(100% - 24px); margin: 0 12px 8px; justify-content: space-between; align-items: center; background: #fff; border: 1px solid var(--tint); border-radius: 10px; padding: 10px 14px; font-weight: 600; color: var(--brand); }
    .nt-body { padding: 20px 16px 32px; }
    .nt-nav { grid-template-columns: 1fr 1fr; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .nt-nav .mid { grid-column: 1 / -1; grid-row: 1; }
  }
</style>
</head>
<body>
<header id="site-header"></header>
<main class="nt" id="main"></main>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/fx.js"></script>
<script src="assets/js/pages/cert-notes.js"></script>
</body>
</html>
