<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Learning · SkillRadius</title>
<meta name="description" content="Your SkillRadius learning dashboard: courses, live sessions, certifications and progress.">
<meta name="robots" content="noindex">
<meta name="sr-page" content="dashboard">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
<aside class="sidebar" aria-label="Sidebar">
  <a class="brand" href="index.html" aria-label="SkillRadius home" id="side-brand"></a>
  <nav class="side-nav" id="side-nav" aria-label="Main"></nav>
  <div class="side-promo">
    <svg class="deco" viewBox="0 0 100 100" aria-hidden="true"><path d="M40 0l8 14 12-12 2 18 18-6-6 18 18 2-12 12 14 8-14 8 12 12-18 2 6 18-18-6-2 18-12-12-8 14-8-14-12 12-2-18-18 6 6-18-18-2 12-12-14-8 14-8z" transform="translate(16 2)" fill="url(#g-c)"/></svg>
    <h4>Get certified</h4>
    <p>25+ industry certifications with proctored exams.</p>
    <a href="certifications.html">Explore programs</a>
  </div>
</aside>

<div class="main">
  <header class="topbar">
    <a class="brand m-brand" href="index.html" aria-label="SkillRadius home" id="m-brand"></a>
    <div class="search" id="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search your courses, trainings, certifications" aria-label="Search your learning" autocomplete="off">
      <div class="search-results" id="search-results" hidden></div>
    </div>
    <div class="top-actions">
      <button class="icon-btn m-search" id="m-search" aria-label="Search"></button>
      <div class="rel">
        <button class="icon-btn" id="notif-btn" aria-label="Notifications" aria-haspopup="true" aria-expanded="false"><span id="notif-icon"></span><span class="dot" id="notif-dot"></span></button>
        <div class="pop notif" id="notif-pop" hidden></div>
      </div>
      <div class="rel">
        <button class="user-btn" id="user-btn" aria-haspopup="true" aria-expanded="false">
          <span class="hi">Hi <span id="first-name"></span></span>
          <img alt="" id="avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="pop menu" id="user-menu" hidden></div>
      </div>
    </div>
  </header>
  <main class="content" id="view"></main>
</div>

<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div class="toast" id="toast" role="status" hidden></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/pages/dashboard.js"></script>
</body>
</html>
