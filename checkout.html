<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkout · SkillRadius</title>
<meta name="description" content="Secure checkout for SkillRadius courses, live trainings and certifications, with a GST invoice.">
<meta name="robots" content="noindex">
<meta name="sr-page" content="checkout">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  .co { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 32px; align-items: start; }
  .co h1 { font-size: 30px; font-weight: 600; margin-bottom: 6px; }
  .steps-bar { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--ink-3); margin-bottom: 22px; flex-wrap: wrap; }
  .steps-bar b { color: var(--primary); }
  .pay-methods { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .pay-methods label { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 6px; justify-items: center; text-align: center; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .pay-methods label svg { width: 22px; height: 22px; color: var(--primary); }
  .pay-methods input { position: absolute; opacity: 0; pointer-events: none; }
  .pay-methods label:has(input:checked) { border-color: var(--primary); background: var(--primary-softer); box-shadow: 0 0 0 3px rgba(60,89,200,.12); }
  .pay-methods label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .summary { position: sticky; top: calc(var(--header-h) + 20px); }
  .summary .item { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: center; }
  .summary .item img { width: 96px; aspect-ratio: 16/10; object-fit: cover; border-radius: 10px; }
  .summary .item b { display: block; font-size: 15px; line-height: 1.3; }
  .lines { display: grid; gap: 8px; font-size: 14.5px; }
  .lines div { display: flex; justify-content: space-between; gap: 12px; }
  .lines .total { font-size: 18px; font-weight: 700; padding-top: 10px; border-top: 1px solid var(--line); }
  .coupon { display: flex; gap: 8px; }
  .coupon input { flex: 1; min-width: 0; text-transform: uppercase; }
  .success { text-align: center; display: grid; gap: 14px; justify-items: center; max-width: 560px; margin: 0 auto; padding-block: 40px; }
  .success .tick { width: 76px; height: 76px; border-radius: 50%; background: var(--success-soft); color: var(--success); display: grid; place-items: center; }
  .success .tick svg { width: 40px; height: 40px; }
  .success h1 { font-size: 32px; font-weight: 600; }
  .spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 960px) { .co { grid-template-columns: minmax(0, 1fr); } .summary { position: static; order: -1; } }
  @media (max-width: 640px) { .pay-methods { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body class="alt">
<header id="site-header"></header>
<main class="band section tight" id="main"></main>
<footer id="site-footer" data-variant="mini"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/fx.js"></script>
<script src="assets/js/pages/checkout.js"></script>
</body>
</html>
