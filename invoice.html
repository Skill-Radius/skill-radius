<style>
.inv { max-width: 860px; margin: 0 auto; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: clamp(20px, 4vw, 44px); box-shadow: var(--shadow-sm); }
.inv-top { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; align-items: flex-start; border-bottom: 2px solid var(--primary); padding-bottom: 18px; }
.inv-top h1 { font-size: 26px; font-weight: 700; letter-spacing: .04em; color: var(--brand); text-align: right; }
.inv-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin: 22px 0; font-size: 14px; }
.inv-meta h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.inv table { width: 100%; border-collapse: collapse; font-size: 14px; }
.inv th { text-align: left; background: var(--primary-softer); padding: 10px 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
.inv td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.inv td.r, .inv th.r { text-align: right; font-variant-numeric: tabular-nums; }
.inv .totals { margin-left: auto; width: min(340px, 100%); margin-top: 16px; display: grid; gap: 6px; font-size: 14px; }
.inv .totals div { display: flex; justify-content: space-between; gap: 12px; }
.inv .totals .grand { font-size: 18px; font-weight: 700; border-top: 2px solid var(--ink); padding-top: 8px; }
.inv .paid { display: inline-block; border: 2px solid var(--success); color: var(--success-ink); font-weight: 800; letter-spacing: .12em; padding: 4px 12px; border-radius: 8px; transform: rotate(-6deg); }
.inv-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
@media (max-width: 640px) { .inv-meta { grid-template-columns: minmax(0, 1fr); } .inv-top h1 { text-align: left; } }
@media print { body > header, body > footer, .inv-actions, .crumbs { display: none !important; } body { background: #fff; } .inv { border: 0; box-shadow: none; } }
</style>
