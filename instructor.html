<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trainer · SkillRadius</title>
<meta name="description" content="Trainer at SkillRadius">
<meta name="sr-page" content="instructor">
<meta name="claude:viewport-fit-sides" content="cover">
<meta property="og:title" content="Trainer · SkillRadius">
<meta property="og:description" content="Trainer">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
@media (max-width: 640px) { #main section.card { grid-template-columns: minmax(0,1fr) !important; text-align: center; justify-items: center; } #main section.card .row { justify-content: center; } }
</style>
</head>
<body>
<header id="site-header"></header>
<main class="band section tight" id="main"></main>
<footer id="site-footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/fx.js"></script>
<script>
(function(){
  const { $, esc, icon } = SR;
  function render() {
    const k = SR.hashId(), p = SR.instructors[k];
    if (!p) { location.replace(location.hash.length > 1 ? "404.html" : "instructors.html"); return; }
    document.title = p.name + " · SkillRadius";
    const courses = SR.publicCourses().filter(c => c.instructor === k);
    const batches = SR.openTrainings().filter(t => t.trainer === k);
    const events = SR.events.filter(e => e.host === k && e.date > Date.now());
    const posts = SR.posts.filter(x => x.author === k);
    $("#main").innerHTML = `
    <div class="wrap">
      <ol class="crumbs"><li><a href="index.html">Home</a></li><li><a href="instructors.html">Trainers</a></li><li>${esc(p.name)}</li></ol>
      <section class="card" style="display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;padding:28px">
        <span class="avatar-i" style="background:${p.color};width:110px;height:110px;font-size:34px">${SR.initials(p.name)}</span>
        <div><h1 style="font-size:clamp(26px,3.6vw,36px);font-weight:600">${esc(p.name)}</h1><p class="muted" style="font-size:17px">${esc(p.role)} · ${esc(p.city || "India")}</p>
          <div class="row" style="margin-top:12px;gap:8px">${(p.expertise || []).map(x => `<span class="pill blue">${esc(x)}</span>`).join("")}</div></div>
      </section>
      <div class="stat-strip" style="margin-top:20px"><div><b>${p.rating}★</b><span>Trainer rating</span></div><div><b>${(p.learners || 0).toLocaleString("en-IN")}</b><span>Learners taught</span></div><div><b>${p.years}</b><span>Years in industry</span></div><div><b>${courses.length + batches.length}</b><span>Active programs</span></div></div>
      <section style="margin-top:36px" class="grid-2"><div class="card"><h2 style="font-size:20px;font-weight:600;margin-bottom:10px">About</h2><p>${esc(p.bio)}</p></div>
        <div class="card"><h2 style="font-size:20px;font-weight:600;margin-bottom:10px">Teaching style</h2><ul class="check-list small"><li>${icon("check")}Project-first: every concept ends in something you build</li><li>${icon("check")}Weekly feedback on your work</li><li>${icon("check")}Answers questions in the course Q&amp;A within 24 hours</li></ul></div></section>
      ${batches.length ? `<section style="margin-top:36px"><h2 style="font-size:24px;font-weight:600;margin-bottom:16px">Upcoming live batches</h2><div class="grid-2">${batches.map(t => SR.trainingCard(t)).join("")}</div></section>` : ""}
      ${courses.length ? `<section style="margin-top:36px"><h2 style="font-size:24px;font-weight:600;margin-bottom:16px">Courses</h2><div class="grid-3">${courses.map(SR.courseCard).join("")}</div></section>` : ""}
      ${events.length ? `<section style="margin-top:36px"><h2 style="font-size:24px;font-weight:600;margin-bottom:16px">Free events</h2><div class="stack">${events.map(e => `<a class="card row" href="events.html" style="text-decoration:none;justify-content:space-between"><span><span class="pill violet">${e.type}</span> <b style="margin-left:6px">${esc(e.title)}</b></span><span class="small muted">${SR.fmtDate(e.date, { weekday: "short", day: "numeric", month: "short" })}</span></a>`).join("")}</div></section>` : ""}
      ${posts.length ? `<section style="margin-top:36px"><h2 style="font-size:24px;font-weight:600;margin-bottom:16px">Articles</h2><div class="stack">${posts.map(x => `<a class="card" href="article.html#${x.slug}" style="text-decoration:none"><b>${esc(x.title)}</b><p class="small muted">${esc(x.excerpt)}</p></a>`).join("")}</div></section>` : ""}
    </div>`;
  }
  addEventListener("hashchange", () => { render(); scrollTo(0, 0); });
  render();
})();
</script>
</body>
</html>
