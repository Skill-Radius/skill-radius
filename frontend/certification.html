<!doctype html>

<style>
  /* Figma frame "Course Page" (Certification section): hero + stat bar, preview, what you get,

  .cd { --x: clamp(16px, 4.63vw, 80px); }
  .cd .in { padding-inline: var(--x); max-width: 1728px; margin-inline: auto; }
  .cd-hero { position: relative; background: #fff; }
  .cd-hero .in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 579px); gap: clamp(24px, 4.6vw, 80px); align-items: end; padding-top: 36px; }

  .cd-eyebrow { display: inline-flex; align-items: center; height: 28px; padding: 0 16px; border-radius: 34px; background: var(--tint); color: var(--brand); font-size: 11px; font-weight: 600; margin-top: 11px; min-width: 120px; }
  .cd-hero h1 { font-size: clamp(28px, 2.32vw, 40px); font-weight: 600; color: #000; line-height: 1.22; margin-top: 14px; text-wrap: wrap; }

  .cd-hero .desc { font-size: 14px; color: var(--ink-2); line-height: 17px; margin-top: 8px; max-width: 840px; }

  .tick3 i, .ben2 i { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--tint); display: grid; place-items: center; color: var(--primary); }

  .cd-banner .chips b { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--primary); font-weight: 600; }
  .cd-banner .chips b svg { width: 14px; height: 14px; }
  .cd-banner .chips span { font-size: 12px; color: #3f5aa8; }
  .cd-about { padding-block: 32px 22px; }

  .cd-about h2 { font-size: 28px; font-weight: 600; color: #000; line-height: 34px; margin-top: 8px; }
  .cd-about .lv { font-size: 15px; font-weight: 600; color: var(--brand); margin-top: 6px; }
  .cd-about .p { font-size: 14px; color: var(--ink-2); line-height: 17px; margin-top: 10px; max-width: 740px; }
  .cd-about .more { display: inline-block; font-size: 13px; font-weight: 500; color: var(--primary); margin-top: 28px; text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; }

  .cd-about ul li::before { content: "•"; margin-right: 8px; }

  .ind h3 { font-size: 16px; font-weight: 600; color: #000; }
  .ind > svg { width: 27px; height: 26px; color: var(--primary); margin: 34px auto 40px; display: block; }

  .ind .g span { display: block; font-size: 12px; color: var(--ink-2); margin-top: 8px; }

  .ind .g span { max-width: calc(100% - 50px); }
  .cd-learn { padding-block: 22px 80px; }
  .cd-learn .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; margin-top: 20px; }
  .cd-learn .tiles div { height: 72px; background: #f8f9ff; border: 1px solid var(--tint); border-radius: 12px; display: grid; align-content: center; justify-items: center; }
  .cd-learn .tiles b { font-size: 28px; font-weight: 600; color: var(--primary); line-height: 34px; }
  .cd-learn .tiles span { font-size: 12px; color: var(--ink-2); }
  .mods { display: grid; gap: 4px; margin-top: 28px; text-align: left; }
  .mods details { border: 1px solid var(--tint); border-radius: 8px; background: #fff; }
  .mods summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; padding: 0 12px 0 16px; font-size: 13px; font-weight: 600; color: #000; cursor: pointer; }
  .mods summary::-webkit-details-marker { display: none; }
  .mods summary svg { width: 24px; height: 24px; color: #2e51c5; transition: transform .2s; flex: none; }
  .mods details[open] summary svg { transform: rotate(180deg); }
  .mods details[open] { border-color: #b9c6ff; }
  .mods .body { padding: 0 16px 14px; font-size: 13px; color: var(--ink-2); display: grid; gap: 6px; }
  .mods .body li { display: flex; gap: 8px; align-items: center; }
  .mods .body ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .mods .body svg { width: 16px; height: 16px; color: var(--primary); }
  @media (max-width: 1100px) { .tick3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cd-about .in { grid-template-columns: minmax(0, 1fr); } .cd-stats .in { grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 0; padding-inline: 16px; } .cd-stats div + div::before { left: 0; } }
  @media (max-width: 960px) { .cd-hero .in { grid-template-columns: minmax(0, 1fr); } .cd-img { order: -1; border-radius: 12px; height: auto; aspect-ratio: 579 / 371; margin-bottom: 0; } .cd-hero .txt { padding-bottom: 28px; } .ben2 { grid-template-columns: minmax(0, 1fr); } .cd-banner { height: auto; padding-bottom: 32px; } }
  @media (max-width: 960px) { .cd-banner .sh { opacity: .22; } }
  @media (max-width: 640px) { .cd-video .t { left: 16px; right: 16px; top: 12px; } .cd-video .t h3 { font-size: 14px; line-height: 19px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; } .cd-video button { top: 62%; width: 52px; height: 52px; } .cd-video button svg { width: 52px; height: 52px; } .cd-banner { height: auto; padding-bottom: 28px; } .ind .g div { height: auto; min-height: 84px; } }
  @media (max-width: 640px) { .tick3, .cd-learn .tiles { grid-template-columns: minmax(0, 1fr); } .cd-stats .in { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 16px; } .cd-stats div:nth-child(3)::before { display: none; } .cd-banner .chips { grid-template-columns: minmax(0, 1fr); gap: 14px; } .cd-btns .btn { flex: 1; width: auto; min-width: 150px; } .ind .g { grid-template-columns: minmax(0, 1fr); } .cd-prev { padding-block: 48px 64px; } .cd-video .t h3 { font-size: 15px; line-height: 1.3; } .cd-video .t p { display: none; } }
  /* Restored sections, same tokens as the Figma frame */
  .cd-hub { padding-block: 48px 0; }
  .cd-hub .in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  .hub-card, .ex-card { background: #fff; border: 1px solid var(--tint); border-radius: 18px; box-shadow: 0 4px 20px rgba(0,0,0,.06); padding: 24px; text-align: left; }
  .hub-card .hh { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .hub-card h2, .ex-card h3 { font-size: 20px; font-weight: 600; color: #000; }
  .cd-pill.ok { background: #cdffe2; color: #227444; }

  .hub-mods a { color: #222; text-decoration: none; font-weight: 500; } .hub-mods a:hover { color: var(--primary); }
  .hub-mods .n { width: 28px; height: 28px; border-radius: 50%; background: var(--tint); color: var(--ink-3); font-size: 12px; font-weight: 600; display: grid; place-items: center; }
  .hub-mods .n svg { width: 15px; height: 15px; }

  .hub-mods li.cur { background: var(--tint); border-color: #b9c6ff; } .hub-mods li.cur .n { background: var(--primary); color: #fff; }
  .hub-mods .st { font-size: 12px; color: var(--ink-3); } .hub-mods li.cur .st { color: var(--primary); font-weight: 600; } .hub-mods .st svg { width: 14px; height: 14px; }

  .att { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 12px; }

  .att td { padding: 9px 8px; border-bottom: 1px solid var(--tint); }

  .cd-extra .skills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .cd-faq { background: #f8f9ff; padding-block: 64px; }

  .cd-cta .arc { position: absolute; left: 50%; top: 40px; width: max(1100px, 121vw); max-width: none; transform: translateX(-50%); z-index: -1; }
  .cd-cta h2 { font-size: clamp(32px, 3.7vw, 64px); font-weight: 600; color: var(--heading); line-height: 1.22; }
  .cd-cta p { color: var(--ink-2); font-size: clamp(16px, 1.16vw, 20px); margin-top: 20px; }
  .cd-cta .cta-btns { display: flex; justify-content: center; gap: 18px; margin-top: 36px; flex-wrap: wrap; }
