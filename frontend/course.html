<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Course · SkillRadius</title>
<meta name="description" content="Course overview, curriculum, instructor, reviews and pricing on SkillRadius.">
<meta name="sr-page" content="course">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  /* Figma frame "Course Detail Page": content left (746px), sticky purchase card right (543px) */
  .cdp { --k: min(1px, calc(100vw / 1728)); padding-top: max(24px, calc(39 * var(--k))); padding-bottom: 96px; }
  .cdp .in { width: min(1389px, 100% - 2 * clamp(16px, 9.8vw, 169px)); margin-inline: auto; display: grid; grid-template-columns: minmax(0, 746px) minmax(0, 543px); justify-content: space-between; gap: 40px; align-items: start; }
  .cdp h1 { font-size: clamp(30px, 2.78vw, 48px); font-weight: 500; color: #202020; line-height: 1.23; text-wrap: wrap; }
  .cdp .sub { font-size: clamp(16px, 1.04vw, 18px); font-weight: 500; color: #202020; line-height: 1.22; margin-top: 21px; max-width: 684px; }
  .cdp h2 { font-size: clamp(20px, 1.39vw, 24px); font-weight: 700; color: #202020; line-height: 29px; }
  .cdp .sec { margin-top: 48px; }
  .cdp .ov p { font-size: clamp(15px, 1.04vw, 18px); font-weight: 500; color: #636363; line-height: 1.22; margin-top: 16px; max-width: 684px; }
  .cdp .inc { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 17px; }
  .cdp .inc li { display: flex; align-items: center; gap: 8px; font-size: clamp(15px, 1.04vw, 18px); font-weight: 500; color: #636363; }
  .cdp .inc svg { width: 24px; height: 24px; color: #636363; flex: none; }
  .cdp .note { font-size: clamp(15px, 1.04vw, 18px); font-weight: 500; color: #636363; margin-top: 15px; }
  .cdp .out { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
  .cdp .out li { display: flex; align-items: center; gap: 16px; min-height: 40px; font-size: clamp(15px, 1.04vw, 18px); font-weight: 600; color: #3b3b3b; }
  .cdp .out i { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; flex: none; transform: scale(.8); }
  .cdp .out i svg { width: 22px; height: 22px; }
  .pcard { position: sticky; top: calc(var(--header-h) + 20px); background: #fafbff; border: 1px solid rgba(147, 170, 255, .25); border-radius: 24px; box-shadow: 0 20px 30px rgba(60, 90, 199, .08); padding: 10px; }
  .pcard > img { width: 100%; aspect-ratio: 523 / 285; object-fit: cover; border-radius: 10px; display: block; }
  .pcard .tint { background: #e5ebff; border: 1px solid #d7dfff; border-radius: 18px; margin-top: 11px; overflow: hidden; }
  .pcard .assure { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); }
  .pcard .assure li { display: flex; align-items: center; gap: 8px; } .pcard .assure svg { width: 16px; height: 16px; color: var(--success, #16a34a); flex: none; }
  .pcard .wh { background: #fff; border-radius: 18px; padding: 22px 26px 22px; display: grid; gap: 14px; }
  .pcard .t { font-size: 20px; font-weight: 500; color: var(--primary); line-height: 1.2; }
  .pcard .by { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 10px; font-size: 16px; font-weight: 500; color: var(--primary); }
  .pcard .by span { display: inline-flex; align-items: center; gap: 6px; }
  .pcard .by img { width: 20px; height: 20px; }
  .pcard .best { display: inline-flex; align-items: center; gap: 4px; height: 31px; padding: 0 12px; border-radius: 9px; background: #eef2ff; border: 1px solid #b9c7ff; box-shadow: inset 0 -4px 8px rgba(0, 55, 255, .12); font-size: 14px; color: var(--primary); }
  .pcard .meta { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; font-size: 16px; color: var(--primary); padding-bottom: 16px; border-bottom: 1px solid #e5ebff; }
  .pcard .meta span { display: inline-flex; align-items: center; gap: 6px; }
  .pcard .meta svg { width: 20px; height: 20px; }
  .pcard .meta .sr-stars { gap: 2px; color: #636363; font-size: 14px; }
  .pcard .price { display: flex; align-items: baseline; gap: 10px; }
  .pcard .price b { font-size: 48px; font-weight: 500; color: #202020; line-height: 1; }
  .pcard .price s { font-size: 24px; color: #767676; }
  .pcard .price .off { margin-left: auto; align-self: center; background: #cdffe2; color: #227444; font-size: 16px; font-weight: 600; padding: 4px 12px; border-radius: 6px; }
  .pcard .buy { height: 47px; border-radius: 10px; font-size: 20px; font-weight: 500; }
  .pcard .hurry { padding: 12px 24px 14px; font-size: 16px; font-weight: 500; color: rgba(0,0,0,.37); }
  .pcard .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .pcard h3 { font-size: 20px; font-weight: 500; color: var(--primary); margin: 18px 16px 12px; }
  .pmods { display: grid; gap: 12px; padding: 0 0 6px; }
  .pmods details { background: #e5ebff; border-radius: 12px; }
  .pmods summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 66px; padding: 0 22px; background: #dfe6ff; border-radius: 12px; font-size: 16px; font-weight: 500; color: var(--primary); cursor: pointer; }
  .pmods summary::-webkit-details-marker { display: none; }
  .pmods summary svg { width: 22px; height: 22px; flex: none; color: var(--primary); transition: transform .2s; }
  .pmods details[open] summary svg.chev { transform: rotate(180deg); }
  .pmods ul { list-style: none; margin: 0; padding: 12px 22px 16px 36px; display: grid; gap: 8px; }
  .pmods li { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; color: var(--primary); }
  .pmods li::before { content: "•"; }
  .pmods li a { color: inherit; text-decoration: none; } .pmods li a:hover { text-decoration: underline; }
  .pmods li .d { margin-left: auto; font-size: 12px; color: #7a8bd0; }
  .pmods li.done { color: #227444; }
  .pcard .prog { display: grid; gap: 8px; }
  .pcard .prog .row { justify-content: space-between; font-size: 15px; color: #636363; }
  .cdp .rv-sec .rating-summary { margin-top: 16px; }
  @media (max-width: 1100px) { .cdp .in { grid-template-columns: minmax(0, 1fr) minmax(0, 420px); } .pcard .price b { font-size: 38px; } }
  @media (max-width: 900px) { .cdp .in { grid-template-columns: minmax(0, 1fr); row-gap: 0; } .cdp .in > article { display: contents; } .pcard { margin-top: 24px; } .cdp .in > article > .crumbs, .cdp .in > article > h1, .cdp .in > article > .sub { order: -2; } .pcard { position: static; order: -1; } .pcard > h3, .pcard > .pmods { display: none; } }
</style>
</head>
<body>
<header id="site-header"></header>
<main class="cdp" id="main"></main>
<footer id="site-footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/fx.js"></script>
<script src="assets/js/pages/course.js"></script>
</body>
</html>
