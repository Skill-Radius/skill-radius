<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courses · SkillRadius</title>
<meta name="description" content="Browse self-paced SkillRadius courses in development, AI, design, creative skills and business.">
<meta name="sr-page" content="courses">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<header id="site-header"></header>

<main>
  <section class="band cat-top">
    <div class="wrap mid">
      <h1 class="sr-only">Courses</h1>
      <form class="searchbar" id="search-form" role="search">
        <input id="q" type="search" placeholder="Search courses, e.g. full stack web dev" aria-label="Search courses" autocomplete="off">
        <button class="btn" type="submit" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg></button>
      </form>
      <div class="results-bar">
        <p id="summary" aria-live="polite"></p>
        <p id="count"></p>
      </div>
    </div>
  </section>

  <section class="band cat-body">
    <div class="wrap mid catalog">
      <aside class="filters" id="filters" aria-label="Filters">
        <div class="fhead"><h2><svg viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M440-120v-240h80v80h320v80H520v80h-80Zm-320-80v-80h240v80H120Zm160-160v-80H120v-80h160v-80h80v240h-80Zm160-80v-80h400v80H440Zm160-160v-240h80v80h160v80H680v80h-80Zm-480-80v-80h400v80H120Z"/></svg>FILTER</h2><button class="link" type="button" id="clear">Clear all</button></div>
        <div class="fgroup" id="f-cat"></div>
        <div class="fgroup" id="f-price"></div>
        <div class="fgroup" id="f-dur"></div>
        <div class="fgroup" id="f-level"></div>
        <div class="fgroup" id="f-rating"></div>
        <div class="fgroup sortby"><h3><label for="sort" style="padding:0;font:inherit;color:inherit">Sort by</label></h3>
          <select class="select" id="sort">
            <option value="popular">Most popular</option>
            <option value="rating">Highest rated</option>
            <option value="new">Newest</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
          </select>
        </div>
      </aside>

      <div>
        <div class="row ft-row" style="margin-bottom:16px"><button class="btn plain sm filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="filters">Filters</button></div>
        <div class="active-filters" id="chips"></div>
        <div class="grid-3" id="grid" style="gap:28px 25px"></div>
        <nav class="pager" id="pager" aria-label="Pages"></nav>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/fx.js"></script>
<script src="assets/js/catalog.js"></script>
<script>
  /* Course catalog — config for the shared catalog engine */
  SR.catalog({
    items: SR.publicCourses(),
    noun: ["course", "courses"],
    text: c => [c.title, c.subtitle, c.cat, c.level, ...c.outcomes].join(" "),
    groups: [
      { id: "cat", el: "#f-cat", label: "Category", values: c => [c.cat] },
      { id: "price", el: "#f-price", label: "Price", values: c => [c.price === 0 ? "Free" : "Paid"] },
      { id: "dur", el: "#f-dur", label: "Duration", order: ["Under 5 hrs", "5–10 hrs", "10–20 hrs", "20+ hrs"], values: c => [c.hours < 5 ? "Under 5 hrs" : c.hours <= 10 ? "5–10 hrs" : c.hours <= 20 ? "10–20 hrs" : "20+ hrs"] },
      { id: "level", el: "#f-level", label: "Level", values: c => [c.level] },
      { id: "rating", el: "#f-rating", label: "Rating", radio: true, order: ["4.5 & up", "4.0 & up"], values: c => [c.rating >= 4.5 ? "4.5 & up" : null, c.rating >= 4 ? "4.0 & up" : null].filter(Boolean) }
    ],
    sorts: {
      popular: (a, b) => b.learners - a.learners,
      rating: (a, b) => b.rating - a.rating,
      new: (a, b) => new Date("1 " + b.updated) - new Date("1 " + a.updated),
      "price-asc": (a, b) => a.price - b.price,
      "price-desc": (a, b) => b.price - a.price
    },
    card: SR.courseCard,
    empty: { title: "No courses found", hint: "Try a different search term, or clear some filters.", alt: [["Browse certifications", "certifications.html"], ["See live trainings", "trainings.html"]] }
  });
</script>
</body>
</html>
