<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trainer · SkillRadius</title>
<meta name="description" content="Trainer at SkillRadius">
<meta name="sr-page" content="instructor">
<meta name="claude:viewport-fit-sides" content="cover">
<meta property="og:title" content="Trainer · SkillRadius">
<meta property="og:description" content="Trainer">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  .ip-hero { position: relative; border-radius: 26px; background: #fff; border: 1px solid var(--primary-line); overflow: hidden; box-shadow: 0 30px 60px -44px rgba(60, 90, 199, .55); }
  .ip-cover { position: relative; height: 150px; background: linear-gradient(120deg, var(--c), color-mix(in srgb, var(--c) 55%, #1a2a6c)); overflow: hidden; }
  .ip-cover::before { content: ""; position: absolute; right: -60px; top: -90px; width: 320px; height: 320px; border-radius: 50%; background: rgba(255, 255, 255, .13); }
  .ip-cover::after { content: ""; position: absolute; right: 150px; bottom: -120px; width: 220px; height: 220px; background: conic-gradient(from 135deg, rgba(255, 255, 255, .28), transparent 60%); }
  .ip-cover img { position: absolute; right: 34px; top: 30px; width: 86px; opacity: .22; filter: brightness(0) invert(1); }
  .ip-tag { position: absolute; left: 28px; top: 22px; display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 99px; background: rgba(255, 255, 255, .18); color: #fff; font-size: 13px; font-weight: 600; backdrop-filter: blur(6px); }
  .ip-tag svg { width: 15px; height: 15px; }
  .ip-body { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 24px; align-items: end; padding: 0 28px 26px; }
  .ip-body .avatar-i { width: 124px; height: 124px; font-size: 38px; margin-top: -62px; border: 5px solid #fff; box-shadow: 0 16px 30px -16px rgba(20, 30, 80, .5); position: relative; }
  .ip-body h1 { font-size: clamp(26px, 3.2vw, 36px); font-weight: 600; line-height: 1.15; color: var(--ink); margin-top: 14px; }
  .ip-body .role { font-size: 17px; color: var(--ink-2); margin-top: 4px; }
  .ip-body .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .ip-acts { display: flex; gap: 10px; flex-wrap: wrap; align-self: center; margin-top: 14px; }
  .ip-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--primary-line); background: var(--primary-softer, #f6f8ff); }
  .ip-stats div { padding: 18px 12px; text-align: center; display: grid; gap: 2px; }
  .ip-stats div + div { border-left: 1px solid var(--primary-line); }
  .ip-stats b { font-size: 24px; font-weight: 600; color: var(--brand); line-height: 1.1; }
  .ip-stats span { font-size: 13.5px; color: var(--ink-2); }
  .ip-h { font-size: 24px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: baseline; gap: 10px; }
  .ip-h small { font-size: 14px; font-weight: 500; color: var(--ink-3); }
  .ip-about h2 { font-size: 20px; font-weight: 600; margin-bottom: 10px; }
  .ip-ev { text-decoration: none; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
  .ip-ev .d { width: 54px; border-radius: 12px; background: var(--primary-soft, #e8edff); color: var(--brand); text-align: center; padding: 7px 0; line-height: 1.1; }
  .ip-ev .d b { display: block; font-size: 20px; } .ip-ev .d span { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .ip-ev:hover { border-color: #b9c7ff; }
  @media (max-width: 760px) { .ip-body { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; padding: 0 18px 22px; } .ip-body .chips, .ip-acts { justify-content: center; } .ip-cover { height: 118px; } .ip-tag { left: 16px; top: 14px; } .ip-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ip-stats div:nth-child(3) { border-left: 0; } .ip-stats div:nth-child(n+3) { border-top: 1px solid var(--primary-line); } }
</style>
</head>
<body>
<header id="site-header"></header>
<main class="band section tight" id="main"></main>
<footer id="site-footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/fx.js"></script>
<script>
(function(){
  const { $, esc, icon } = SR;
  function render() {
    const k = SR.hashId(), p = SR.instructors[k];
    if (!p) { location.replace(location.hash.length > 1 ? "404.html" : "instructors.html"); return; }
    document.title = p.name + " · SkillRadius";
    const courses = SR.publicCourses().filter(c => c.instructor === k);
    const batches = SR.openTrainings().filter(t => t.trainer === k);
    const events = SR.events.filter(e => e.host === k && e.date > Date.now());
    const posts = SR.posts.filter(x => x.author === k);
    $("#main").innerHTML = `
    <div class="wrap">
      <ol class="crumbs"><li><a href="index.html">Home</a></li><li><a href="instructors.html">Trainers</a></li><li>${esc(p.name)}</li></ol>
      <section class="ip-hero" style="--c:${p.color}">
        <div class="ip-cover"><span class="ip-tag">${icon("award")}SkillRadius trainer${p.rating >= 4.8 ? " · Top rated" : ""}</span><img src="assets/img/logo-mark.svg" alt=""></div>
        <div class="ip-body">
          <span class="avatar-i" style="background:${p.color}">${SR.initials(p.name)}</span>
          <div><h1>${esc(p.name)}</h1><p class="role">${esc(p.role)} · ${esc(p.city || "India")}</p>
            <div class="chips">${(p.expertise || []).map(x => `<span class="pill blue">${esc(x)}</span>`).join("")}</div></div>
          <div class="ip-acts">${batches.length ? `<a class="btn" href="#ip-batches">See live batches ${icon("arrow")}</a>` : courses.length ? `<a class="btn" href="#ip-courses">See courses ${icon("arrow")}</a>` : ""}<a class="btn ghost" href="contact.html">Ask a question</a></div>
        </div>
        <div class="ip-stats"><div><b>${p.rating} ★</b><span>Trainer rating</span></div><div><b>${(p.learners || 0).toLocaleString("en-IN")}</b><span>Learners taught</span></div><div><b>${p.years} yrs</b><span>In the industry</span></div><div><b>${courses.length + batches.length}</b><span>Active programs</span></div></div>
      </section>
      <section style="margin-top:28px" class="grid-2 ip-about"><div class="card"><h2>About ${esc(p.name.split(" ")[0] === "Dr." ? p.name : p.name.split(" ")[0])}</h2><p>${esc(p.bio)}</p></div>
        <div class="card"><h2>Teaching style</h2><ul class="check-list small"><li>${icon("check")}Project-first: every concept ends in something you build</li><li>${icon("check")}Weekly feedback on your work</li><li>${icon("check")}Answers questions in the course Q&amp;A within 24 hours</li></ul></div></section>
      ${batches.length ? `<section style="margin-top:40px;scroll-margin-top:100px" id="ip-batches"><h2 class="ip-h">Upcoming live batches<small>${batches.length} open</small></h2><div class="grid-2">${batches.map(t => SR.trainingCard(t)).join("")}</div></section>` : ""}
      ${courses.length ? `<section style="margin-top:40px;scroll-margin-top:100px" id="ip-courses"><h2 class="ip-h">Courses<small>Self-paced</small></h2><div class="grid-3">${courses.map(SR.courseCard).join("")}</div></section>` : ""}
      ${events.length ? `<section style="margin-top:40px"><h2 class="ip-h">Free events<small>Live and free to join</small></h2><div class="stack">${events.map(e => { const d = new Date(e.date); return `<a class="card ip-ev" href="events.html"><span class="d"><span>${d.toLocaleDateString("en-IN", { month: "short" })}</span><b>${d.getDate()}</b></span><span><span class="pill violet">${e.type}</span> <b style="margin-left:6px">${esc(e.title)}</b><span class="small muted" style="display:block;margin-top:4px">Free · ${SR.fmtDate(e.date, { weekday: "long", hour: "numeric", minute: "2-digit" })}</span></span><span class="link small">Register →</span></a>`; }).join("")}</div></section>` : ""}
      ${posts.length ? `<section style="margin-top:40px"><h2 class="ip-h">Articles<small>From the SkillRadius blog</small></h2><div class="grid-2">${posts.map(x => `<a class="card" href="article.html#${x.slug}" style="text-decoration:none;display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:center"><img src="${x.img}" alt="" style="width:96px;height:72px;object-fit:cover;border-radius:12px"><span><b style="display:block;line-height:1.3">${esc(x.title)}</b><span class="small muted" style="display:block;margin-top:4px">${x.read || 5} min read</span></span></a>`).join("")}</div></section>` : ""}
      <div class="sr-band" style="margin-top:48px"><span class="sh a" aria-hidden="true"></span><span class="sh b" aria-hidden="true"></span><span class="sh c" aria-hidden="true"></span><div class="t"><span class="k">Learn with ${esc(p.name.split(" ")[0] === "Dr." ? p.name : p.name.split(" ")[0])}</span><h2>Not sure which program fits you?</h2><p>Tell us your goal and we'll point you to the right course or live batch.</p></div><div class="sr-band-cta"><a class="btn" href="paths.html">Explore learning paths</a><a class="btn ghost" href="contact.html">Talk to a counsellor</a></div></div>
    </div>`;
  }
  addEventListener("hashchange", () => { render(); scrollTo(0, 0); });
  render();
})();
</script>
</body>
</html>
