<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset Password · SkillRadius</title>
<meta name="description" content="Set a new password for your SkillRadius account.">
<meta name="robots" content="noindex">
<meta name="sr-page" content="reset">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<main class="auth">
  <aside class="auth-art" aria-hidden="true"><img src="assets/img/art-auth-art.webp" alt=""></aside>
  <section class="auth-panel">
    <div class="auth-bar"><a class="back" href="login.html"><span data-i="arrowl"></span>Back to log in</a><a href="help.html">Need help?</a></div>
    <div class="auth-card">
      <div class="top">
        <a class="brand" href="index.html" aria-label="SkillRadius home"><img src="assets/img/logo-mark.svg" alt="" width="52" height="52"><img src="assets/img/logo-word.svg" alt="SkillRadius" width="112" height="18" style="filter:none"></a>
        <h1>Set a new password</h1>
        <p class="sub">Choose a strong password you haven’t used before.</p>
      </div>
      <form id="form" novalidate>
        <div class="field"><label for="password">New password<span class="req">*</span></label><div class="pw"><input id="password" type="password" autocomplete="new-password"><button type="button" aria-label="Show password"></button></div><div class="pw-meter" id="meter"><i></i><i></i><i></i><i></i></div><span class="hint" id="meter-text">At least 8 characters, with a number and a symbol.</span></div>
        <div class="field"><label for="confirm">Confirm new password<span class="req">*</span></label><div class="pw"><input id="confirm" type="password" autocomplete="new-password"><button type="button" aria-label="Show password"></button></div></div>
        <div id="form-error"></div>
        <button class="btn lg block" type="submit">Reset password</button>
      </form>
    </div>
    <p class="auth-foot"><a href="terms.html">Terms</a><span>·</span><a href="privacy.html">Privacy</a><span>·</span><a href="cookie-policy.html">Cookies</a></p>
  </section>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/fx.js"></script>
<script src="assets/js/pages/auth.js"></script>
</body>
</html>
